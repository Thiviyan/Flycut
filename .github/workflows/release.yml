name: Build Flycut

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build macOS App
        run: |
          xcodebuild \
            -project Flycut.xcodeproj \
            -scheme "Flycut" \
            -configuration Release \
            -destination "platform=macOS" \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED="NO" \
            CODE_SIGNING_ALLOWED="NO" \
            build

      - name: Locate and Archive Build
        run: |
          APP_PATH=$(find ./build/Build/Products/Release -name "Flycut.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Flycut.app not found. Checking build directory:"
            find ./build/Build/Products -maxdepth 3
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" "$GITHUB_WORKSPACE/Flycut.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flycut-macOS
          path: Flycut.zip
