
BUILD_DIR=$(xcodebuild \
  -project Flycut.xcodeproj \
  -scheme "Flycut" \
  -configuration Release \
  -showBuildSettings \
  | awk -F ' = ' '/^[[:space:]]*BUILT_PRODUCTS_DIR = / {print $2; exit}')

echo "Built products dir: $BUILD_DIR"

APP_PATH="$BUILD_DIR/Flycut.app"

if [ ! -d "$APP_PATH" ]; then
  echo "Error: Flycut.app not found at $APP_PATH"
  echo "Checking available Release products:"
  find "$BUILD_DIR" -maxdepth 2 -print 2>/dev/null || true
  exit 1
fi

echo "Found app: $APP_PATH"

ditto -c -k --keepParent \
  "$APP_PATH" \
  "$GITHUB_WORKSPACE/Flycut.zip"
